<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鞍馬貴船時刻盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: one day as a single vermilion thread climbing a cedar mountain and coming back down a valley. A painted route-landscape on top
   (WebGL sky and two rivers under a Canvas 2D land), a time dial, the day as a Gantt strip, and a ledger of every stop. One light "washi" look. */
:root{
  --paper:#E4E8E1; --sheet:#F4F6F0; --ink:#1B2623; --ink2:#55615C; --rule:#C6CEC3;
  --shu:#C23A1E; --sugi:#2F5D48; --river:#2D7390; --kin:#A67B24; --ai:#2B3A5E; --moss:#6B8A3A; --mist:#DCE3D7;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","Hiragino Sans","Yu Gothic","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
a{color:var(--river)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* masthead */
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:18px 26px;align-items:end}
.stamp{width:78px;height:78px;border:2.5px solid var(--shu);color:var(--shu);font-family:var(--f-head);font-weight:800;display:grid;place-items:center;text-align:center;line-height:1.05;font-size:15px;transform:rotate(-3deg);border-radius:2px}
.stamp b{display:block;font-size:24px}
.eyebrow{margin:0 0 2px;font-size:11.5px;letter-spacing:.22em;color:var(--ink2)}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.08;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 em{font-style:normal;color:var(--shu)}
.sub{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(5,auto);gap:4px 18px;margin:0;align-self:end}
.facts div{display:flex;flex-direction:column;border-left:2px solid var(--rule);padding-left:10px}
.facts dt{font-size:11px;color:var(--ink2);letter-spacing:.08em}
.facts dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:980px){.mast{grid-template-columns:auto 1fr}.facts{grid-column:1/-1;grid-template-columns:repeat(5,1fr)}}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,1fr)}.stamp{width:64px;height:64px;font-size:13px}.stamp b{font-size:19px}}

/* stage */
.stage{position:relative;height:clamp(300px,46vw,520px);border-radius:3px;overflow:hidden;background:#cfdfe6;box-shadow:0 1px 0 var(--rule),0 18px 40px -26px rgba(20,35,30,.55)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .note{position:absolute;right:10px;bottom:8px;font-size:10.5px;color:var(--ink2);background:color-mix(in srgb,var(--sheet) 78%,transparent);padding:1px 7px;border-radius:2px;letter-spacing:.06em}
.stage .tlabel{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,3.4vw,34px);color:var(--ink);text-shadow:0 0 8px rgba(255,255,255,.7);font-variant-numeric:tabular-nums}

/* deck */
.deck{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:820px){.deck{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;min-width:0}
.clock .lbl{font-size:11px;letter-spacing:.18em;color:var(--ink2)}
.clock .now{font-family:var(--f-mono);font-weight:600;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock .phase{font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--shu);min-height:3.2em;text-wrap:balance}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:6px 14px;border-radius:2px;cursor:pointer;font-weight:700;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.scrub{width:100%;margin-top:12px;accent-color:var(--shu)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink2)}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-content:start}
.card .seal{grid-row:1/span 3;width:54px;height:54px;border:2px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:28px;border-radius:2px}
.card .seal.k-train,.card .seal.k-walk,.card .seal.k-pause{border-color:var(--ai);color:var(--ai)}
.card .seal.k-eat{border-color:var(--kin);color:var(--kin)}
.card .seal.k-see.kibune{border-color:var(--river);color:var(--river)}
.card .seal.k-see.shimo{border-color:var(--moss);color:var(--moss)}
.card .span{font-family:var(--f-mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.card h2{font-family:var(--f-head);font-weight:800;font-size:clamp(20px,2.6vw,28px);margin:0;line-height:1.25;text-wrap:balance}
.card .jp{color:var(--ink2);font-size:13.5px}
.card .note{grid-column:1/-1;margin-top:6px;font-size:13.5px}
.card .warn{grid-column:1/-1;background:#FFF0D6;color:#6E4300;border-left:3px solid #C98A12;padding:6px 10px;font-size:12.8px;border-radius:0 2px 2px 0}
.card .next{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:13px;color:var(--ink2)}
.card .next b{color:var(--ink);font-weight:700}

/* gantt */
.chart h3,.ledger h3{font-family:var(--f-head);font-weight:800;font-size:19px;margin:0 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chart h3 small,.ledger h3 small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--ink2)}
.scroll{overflow-x:auto;overscroll-behavior-x:contain}
#gantt svg{display:block;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;display:inline-block;border-radius:2px}

/* ledger */
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
@media (max-width:820px){.rows{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:96px 26px minmax(0,1fr);gap:4px 10px;padding:7px 6px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start;border-radius:2px;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;width:100%}
.row:hover{background:var(--mist)}
.row.on{background:color-mix(in srgb,var(--shu) 10%,var(--sheet));box-shadow:inset 3px 0 0 var(--shu)}
.row .t{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.row .k{width:22px;height:22px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:12px;border-radius:2px}
.row .k.train,.row .k.walk,.row .k.pause{color:var(--ai)}
.row .k.see{color:var(--shu)} .row .k.see.kibune{color:var(--river)} .row .k.see.shimo{color:var(--moss)} .row .k.eat{color:var(--kin)} .row .k.seal{color:var(--shu)}
.row b{display:block;font-weight:700}
.row span.d{display:block;font-size:12.3px;color:var(--ink2)}
.row .flag{color:#9A5A00;font-size:12px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="stamp" aria-hidden="true"><span>2027<b>4.8</b>木</span></div>
    <div>
      <p class="eyebrow">鞍馬・貴船一日手冊　別冊</p>
      <h1>今日行程<em>總覽</em></h1>
      <p class="sub">京都駅 07:40 出發，JR、京阪轉叡電到鞍馬，搭纜車上山，翻過奧の院參道下到貴船，午後沿叡電回出町柳，順路走糺の森。轉乘兩次，叡電那一次只有 11 分緩衝。</p>
    </div>
    <dl class="facts">
      <div><dt>出發</dt><dd>07:40</dd></div>
      <div><dt>回到京都</dt><dd>17:00</dd></div>
      <div><dt>交通＋纜車</dt><dd>¥2,120</dd></div>
      <div><dt>御朱印</dt><dd>3–5 張</dd></div>
      <div><dt>步行（估）</dt><dd>約 2h15</dd></div>
    </dl>
  </header>

  <section class="stage" id="stage" aria-label="今日路線示意畫：京都駅、鞍馬、貴船、下鴨神社">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="tlabel" id="tlabel">07:30</div>
    <div class="note">示意圖，非地理比例</div>
  </section>

  <section class="deck">
    <div class="panel clock">
      <div class="lbl">時刻盤</div>
      <div class="now" id="now">07:30</div>
      <div class="phase" id="phase">京都駅</div>
      <div class="ctrl">
        <button class="btn" id="play" type="button">播放一天</button>
        <button class="btn ghost" id="sound" type="button" aria-pressed="false">鈴聲 關</button>
      </div>
      <input class="scrub" id="scrub" type="range" min="450" max="1025" step="1" value="450" aria-label="拖曳時刻">
      <div class="scale"><span>07:30</span><span>12:15</span><span>17:05</span></div>
    </div>
    <article class="panel card" id="card" aria-live="polite"></article>
  </section>

  <section class="panel chart">
    <h3>一日的時間帶<small>橫軸是時刻；點或拖曳圖面可以移動時刻盤</small></h3>
    <div class="scroll"><div id="gantt"></div></div>
    <div class="legend">
      <span><i style="background:var(--ai)"></i>電車・巴士・纜車</span>
      <span><i style="background:var(--shu)"></i>鞍馬寺</span>
      <span><i style="background:var(--river)"></i>貴船</span>
      <span><i style="background:var(--moss)"></i>下鴨</span>
      <span><i style="background:var(--kin)"></i>午餐</span>
      <span><i style="background:repeating-linear-gradient(45deg,#7d8a84 0 2px,transparent 2px 5px);border:1px solid #7d8a84"></i>步行・等車</span>
      <span><i style="border:1.5px solid var(--shu)"></i>御朱印</span>
    </div>
  </section>

  <section class="panel ledger">
    <h3>時刻帳<small>點一列，時刻盤就跳到那裡</small></h3>
    <div class="rows" id="rows"></div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

      if (rc2) sg.node().appendChild(rc2.rectangle(cx - sz / 2, sealY - sz / 2 - 2, sz, sz, { stroke: C.shu, strokeWidth: 1.6, roughness: 1.1, seed: 11 + i, fill: 'rgba(194,58,30,.08)', fillStyle: 'solid', strokeLineDash: sl.flex ? [3, 3] : undefined }));
      else sg.append('rect').attr('x', cx - sz / 2).attr('y', sealY - sz / 2 - 2).attr('width', sz).attr('height', sz).attr('fill', 'none').attr('stroke', C.shu);
      sg.append('text').attr('x', cx).attr('y', sealY + 3).attr('text-anchor', 'middle').attr('font-family', 'Shippori Mincho B1, serif').attr('font-weight', 800).attr('font-size', 13).attr('fill', C.shu).text('印');
      sg.append('text').attr('x', cx).attr('y', sealY + 24 + (i % 2) * 12).attr('text-anchor', 'middle').attr('font-size', 10.5).attr('fill', C.ink2).text(sl.name + (sl.flex ? '（彈性）' : ''));
    });
    // playhead
    const ph = svg.append('g').attr('pointer-events', 'none');
    const pl = ph.append('line').attr('y1', 18).attr('y2', h - 22).attr('stroke', C.shu).attr('stroke-width', 2);
    const pb = ph.append('rect').attr('y', 2).attr('width', 46).attr('height', 17).attr('rx', 2).attr('fill', C.shu);
    const pt = ph.append('text').attr('y', 15).attr('text-anchor', 'middle').attr('font-family', 'IBM Plex Mono, monospace').attr('font-size', 11.5).attr('font-weight', 600).attr('fill', '#fff');
    gantt.update = t => { const px = x(t); pl.attr('x1', px).attr('x2', px); pb.attr('x', px - 23); pt.attr('x', px).text(fmt(t)); };
    gantt.update(state.t);
    const toT = ev => x.invert(d3.pointer(ev, svg.node())[0]);
    svg.on('pointerdown', ev => { stop(); setT(toT(ev)); svg.on('pointermove.drag', e => setT(toT(e))); })
      .on('pointerup pointerleave', () => svg.on('pointermove.drag', null));
  }

  /* ---------- boot ---------- */
  initGL();
  const boot = () => { resize(); drawGantt(); lastShown = -1; setT(state.t); requestAnimationFrame(frame); if (!reduce) setTimeout(() => { if (!playing && state.t <= 455) play(); }, 900); };
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { resize(); drawGantt(); }, 150); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
