<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>稲荷宇治時刻盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
/* Layout: one day as a single vermilion thread. A painted route-landscape on top (WebGL sky and river under a Canvas 2D land),
   a time dial below it, then the day as a Gantt strip and a ledger of every stop. Single deliberate light "washi" look. */
:root{
  --paper:#E8EBE2; --sheet:#F5F6F0; --ink:#1D2725; --ink2:#56615B; --rule:#C9D0C1;
  --shu:#C7351C; --matcha:#58792C; --river:#2E6C82; --kin:#A27A22; --ai:#23365C; --mist:#DDE3D6;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","Hiragino Sans","Yu Gothic","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:22px 40px;display:flex;flex-direction:column;gap:18px}
a{color:var(--river)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

/* masthead */
.mast{display:grid;grid-template-columns:auto 1fr auto;gap:18px 26px;align-items:end}
.stamp{width:78px;height:78px;border:2.5px solid var(--shu);color:var(--shu);font-family:var(--f-head);font-weight:800;display:grid;place-items:center;text-align:center;line-height:1.05;font-size:15px;transform:rotate(-3deg);border-radius:3px;background:color-mix(in srgb,var(--shu) 6%,transparent)}
.stamp b{display:block;font-size:24px}
.eyebrow{margin:0 0 2px;font-size:11.5px;letter-spacing:.22em;color:var(--ink2)}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.08;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 em{font-style:normal;color:var(--shu)}
.sub{margin:6px 0 0;color:var(--ink2);max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(5,auto);gap:4px 18px;margin:0;align-self:end}
.facts div{display:flex;flex-direction:column;border-left:2px solid var(--rule);padding-left:10px}
.facts dt{font-size:11px;color:var(--ink2);letter-spacing:.08em}
.facts dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:980px){.mast{grid-template-columns:auto 1fr}.facts{grid-column:1/-1;grid-template-columns:repeat(5,1fr)}}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,1fr)}.stamp{width:64px;height:64px;font-size:13px}.stamp b{font-size:19px}}

/* stage */
.stage{position:relative;height:clamp(300px,46vw,520px);border-radius:3px;overflow:hidden;background:#cfdfe6;box-shadow:0 1px 0 var(--rule),0 18px 40px -26px rgba(20,35,30,.55)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .note{position:absolute;right:10px;bottom:8px;font-size:10.5px;color:var(--ink2);background:color-mix(in srgb,var(--sheet) 78%,transparent);padding:1px 7px;border-radius:2px;letter-spacing:.06em}
.stage .tlabel{position:absolute;left:12px;top:10px;font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,3.4vw,34px);color:var(--ink);text-shadow:0 0 8px rgba(255,255,255,.7);font-variant-numeric:tabular-nums;letter-spacing:.02em;pointer-events:none}

/* deck */
.deck{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:stretch}
@media (max-width:820px){.deck{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:14px 16px;min-width:0}
.clock .lbl{font-size:11px;letter-spacing:.18em;color:var(--ink2)}
.clock .now{font-family:var(--f-mono);font-weight:600;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock .phase{font-family:var(--f-head);font-weight:800;font-size:18px;color:var(--shu);min-height:1.6em}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:6px 14px;border-radius:2px;cursor:pointer;font-weight:700;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.scrub{width:100%;margin-top:12px;accent-color:var(--shu)}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink2)}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-content:start}
.card .seal{grid-row:1/span 3;width:54px;height:54px;border:2px solid var(--shu);color:var(--shu);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:28px;border-radius:2px;transform:rotate(-2deg)}
.card .seal.k-train,.card .seal.k-walk,.card .seal.k-pause{border-color:var(--ai);color:var(--ai)}
.card .seal.k-eat{border-color:var(--kin);color:var(--kin)}
.card .seal.k-see.uji{border-color:var(--matcha);color:var(--matcha)}
.card .span{font-family:var(--f-mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.card h2{font-family:var(--f-head);font-weight:800;font-size:clamp(20px,2.6vw,28px);margin:0;line-height:1.25;text-wrap:balance}
.card .jp{color:var(--ink2);font-size:13.5px}
.card .note{grid-column:1/-1;margin-top:6px;font-size:13.5px}
.card .warn{grid-column:1/-1;background:#FFF0D6;color:#6E4300;border-left:3px solid #C98A12;padding:6px 10px;font-size:12.8px;border-radius:0 2px 2px 0}
.card .next{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);font-size:13px;color:var(--ink2)}
.card .next b{color:var(--ink);font-weight:700}

/* gantt */
.chart h3,.ledger h3{font-family:var(--f-head);font-weight:800;font-size:19px;margin:0 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.chart h3 small,.ledger h3 small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--ink2)}
.scroll{overflow-x:auto;overscroll-behavior-x:contain}
#gantt svg{display:block;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;display:inline-block;border-radius:2px}

/* ledger */
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
@media (max-width:820px){.rows{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:96px 26px minmax(0,1fr);gap:4px 10px;padding:7px 6px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start;border-radius:2px;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;width:100%}
.row:hover{background:var(--mist)}
.row.on{background:color-mix(in srgb,var(--shu) 10%,var(--sheet));box-shadow:inset 3px 0 0 var(--shu)}
.row .t{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.row .k{width:22px;height:22px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:12px;border-radius:2px}
.row .k.train,.row .k.walk,.row .k.pause{color:var(--ai)}
.row .k.see{color:var(--shu)} .row .k.see.uji{color:var(--matcha)} .row .k.eat{color:var(--kin)} .row .k.seal{color:var(--shu)}
.row b{display:block;font-weight:700}
.row span.d{display:block;font-size:12.3px;color:var(--ink2)}
.row .flag{color:#9A5A00;font-size:12px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="stamp" aria-hidden="true"><span>2027<b>4.8</b>木</span></div>
    <div>
      <p class="eyebrow">伏見稲荷・宇治一日手冊　別冊</p>
      <h1>今日行程<em>總覽</em></h1>
      <p class="sub">京都駅 07:05 發車，沿 JR 奈良線一路南下：早上走稲荷山的千本鳥居，中午到宇治看平等院與宇治川兩岸的神社，15:37 搭みやこ路快速回京都。全程零轉乘。</p>
    </div>
    <dl class="facts">
      <div><dt>出發</dt><dd>07:05</dd></div>
      <div><dt>回到京都</dt><dd>15:55</dd></div>
      <div><dt>JR 三段</dt><dd>¥630</dd></div>
      <div><dt>御朱印</dt><dd>4–5 張</dd></div>
      <div><dt>步行（估）</dt><dd>約 1h45</dd></div>
    </dl>
  </header>

  <section class="stage" id="stage" aria-label="今日路線示意畫：京都駅、伏見稲荷、宇治">
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="tlabel" id="tlabel">07:00</div>
    <div class="note">示意圖，非地理比例</div>
  </section>

  <section class="deck">
    <div class="panel clock">
      <div class="lbl">時刻盤</div>
      <div class="now" id="now">07:00</div>
      <div class="phase" id="phase">京都駅</div>
      <div class="ctrl">
        <button class="btn" id="play" type="button">播放一天</button>
        <button class="btn ghost" id="sound" type="button" aria-pressed="false">鈴聲 關</button>
      </div>
      <input class="scrub" id="scrub" type="range" min="415" max="960" step="1" value="420" aria-label="拖曳時刻">
      <div class="scale"><span>06:55</span><span>11:00</span><span>16:00</span></div>
    </div>
    <article class="panel card" id="card" aria-live="polite"></article>
  </section>

  <section class="panel chart">
    <h3>一日的時間帶<small>橫軸是時刻；點或拖曳圖面可以移動時刻盤</small></h3>
    <div class="scroll"><div id="gantt"></div></div>
    <div class="legend">
      <span><i style="background:var(--ai)"></i>JR 奈良線</span>
      <span><i style="background:var(--shu)"></i>伏見稲荷 參觀</span>
      <span><i style="background:var(--matcha)"></i>宇治 參觀</span>
      <span><i style="background:var(--kin)"></i>逛街・午茶</span>
      <span><i style="background:repeating-linear-gradient(45deg,#7d8a84 0 2px,transparent 2px 5px);border:1px solid #7d8a84"></i>步行・等車</span>
      <span><i style="border:1.5px solid var(--shu)"></i>御朱印</span>
    </div>
  </section>

  <section class="panel ledger">
    <h3>時刻帳<small>點一列，時刻盤就跳到那裡</small></h3>
    <div class="rows" id="rows"></div>
  </section>

</div>

      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > H + 6 || p.x > W + 6) { p.x = Math.random() * W * 0.8 - 20; p.y = -6; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // you two, or the train
    const [u, v] = posAt(t), x = u * W, y = v * H, s = Math.max(0.65, W / 1100);
    if (inTrain(t)) {
      const dir = (TRAIN[2][0] < t) ? -1 : 1;
      drawTrain(x, y, dir, s);
    } else {
      const bob = reduce ? 0 : Math.sin(sec * 3) * 1.2;
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(x, y - 6 + bob, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.shu; ctx.beginPath(); ctx.arc(x - 3.5, y - 7 + bob, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.ai; ctx.beginPath(); ctx.arc(x + 3.5, y - 5 + bob, 4, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  function tracePath(t) {
    ctx.beginPath(); ctx.moveTo(KEYS[0][1] * W, KEYS[0][2] * H);
    for (let i = 1; i < KEYS.length; i++) {
      if (KEYS[i][0] <= t) ctx.lineTo(KEYS[i][1] * W, KEYS[i][2] * H);
      else { const [u, v] = posAt(t); ctx.lineTo(u * W, v * H); break; }
    }
  }

  /* ---------- clock, card, ledger ---------- */
  const nowEl = $('#now'), phaseEl = $('#phase'), card = $('#card'), scrub = $('#scrub'), tlabel = $('#tlabel');
  function phaseName(it, t) { return inTrain(t) ? 'JR 奈良線 乘車中' : LANE[it.lane] + '・' + it.title.replace(/（.*?）/g, ''); }
  function renderCard(t) {
    const it = itemAt(t), i = ITEMS.indexOf(it), nx = ITEMS[i + 1];
    const k = it.kind === 'seal' ? 'seal' : it.kind;
    const left = nx ? Math.max(0, Math.round(nx.a - t)) : 0;
    card.innerHTML = `<div class="seal k-${k} ${it.lane}" aria-hidden="true">${KCH[it.kind]}</div>
      <div class="span">${it.s} – ${it.e}　${LANE[it.lane]}　停留 ${it.b - it.a} 分</div>
      <h2>${it.title}</h2><div class="jp">${it.jp || ''}</div>
      ${it.note ? `<div class="note">${it.note}</div>` : ''}
      ${it.warn ? `<div class="warn">⚠ ${it.warn}</div>` : ''}
      ${nx ? `<div class="next">下一站 <b>${nx.s} ${nx.title}</b>，還有 ${left} 分</div>` : `<div class="next">今天的行程到這裡結束。</div>`}`;
  }
  const rowsEl = $('#rows');
  rowsEl.innerHTML = ITEMS.map((o, i) => `<button class="row" type="button" data-i="${i}">
      <span class="t">${o.s}–${o.e}</span><span class="k ${o.kind} ${o.lane}" aria-hidden="true">${KCH[o.kind]}</span>
      <span><b>${o.title}</b><span class="d">${o.jp || ''}${o.warn ? ' <span class="flag">⚠ 注意</span>' : ''}</span></span></button>`).join('');
  rowsEl.addEventListener('click', e => { const b = e.target.closest('.row'); if (!b) return; stop(); setT(ITEMS[+b.dataset.i].a + 0.5); });

  function setT(t, fromPlay) {
    t = Math.max(T0, Math.min(T1, t));
    if (fromPlay && soundOn) chimes(prevT, t);
    prevT = t; state.t = t;
    const m = Math.floor(t);
    if (m !== lastShown) {
      lastShown = m;
      const s = fmt(m); nowEl.textContent = s; tlabel.textContent = s; scrub.value = m;
      const it = itemAt(t); phaseEl.textContent = phaseName(it, t); renderCard(t);
      rowsEl.querySelectorAll('.row').forEach((r, i) => r.classList.toggle('on', ITEMS[i] === it));
      if (gantt.update) gantt.update(t);
    }
  }

  /* ---------- playback (GSAP, with a plain fallback) ---------- */
  const playBtn = $('#play');
  function play() {
    if (state.t >= T1 - 1) setT(T0);
    playing = true; playBtn.textContent = '暫停'; playBtn.setAttribute('aria-pressed', 'true');
    const dur = 46 * (T1 - state.t) / (T1 - T0);
    if (window.gsap) tween = gsap.to(state, { t: T1, duration: dur, ease: 'none', onUpdate: () => setT(state.t, true), onComplete: stop });
    else { const t0 = performance.now(), s0 = state.t; const step = n => { if (!playing) return; const f = Math.min(1, (n - t0) / (dur * 1000)); setT(s0 + (T1 - s0) * f, true); f < 1 ? requestAnimationFrame(step) : stop(); }; requestAnimationFrame(step); }
  }
  function stop() { playing = false; if (tween) { tween.kill(); tween = null; } playBtn.textContent = '播放一天'; playBtn.setAttribute('aria-pressed', 'false'); }
  playBtn.addEventListener('click', () => playing ? stop() : play());
  scrub.addEventListener('input', () => { stop(); setT(+scrub.value); });

  /* ---------- sound (Tone.js) ---------- */
  const soundBtn = $('#sound');
  if (!window.Tone) soundBtn.hidden = true;
  soundBtn.addEventListener('click', async () => {
    soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', String(soundOn)); soundBtn.textContent = soundOn ? '鈴聲 開' : '鈴聲 關';
    if (soundOn && window.Tone) {
      try {
        await Tone.start();
        if (!synth) { const rv = new Tone.Reverb({ decay: 3.2, wet: 0.35 }).toDestination(); synth = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3.01, modulationIndex: 9, envelope: { attack: 0.002, decay: 1.4, sustain: 0, release: 1.6 }, volume: -16 }).connect(rv); }
        synth.triggerAttackRelease(['E6'], 0.6);
      } catch (e) { soundOn = false; soundBtn.setAttribute('aria-pressed', 'false'); soundBtn.textContent = '鈴聲 關'; }
    }
  });
  function chimes(a, b) {
    if (!synth || b <= a) return;
    SEALS.forEach(sl => { if (a < sl.t && sl.t <= b) synth.triggerAttackRelease(['E6', 'B6'], 0.8); });
    DEPART.forEach(d => { if (a < d && d <= b) { const now = Tone.now(); synth.triggerAttackRelease('G5', 0.25, now); synth.triggerAttackRelease('C6', 0.4, now + 0.22); } });
  }

  /* ---------- Gantt (D3 + Rough.js) ---------- */
  const gantt = {};
  function drawGantt() {
    const host = $('#gantt'); host.innerHTML = '';
    if (!window.d3) { host.innerHTML = '<p style="font-size:12px;color:var(--ink2)">圖表程式庫沒有載入，請看下方時刻帳。</p>'; return; }
    const w = Math.max(980, host.parentElement.clientWidth), h = 318, ml = 92, mr = 30;
    const x = d3.scaleLinear().domain([hm('06:50'), hm('16:08')]).range([ml, w - mr]);
    const lanes = { jr: 48, inari: 112, uji: 196 }, sealY = 262, bh = 28;
    const svg = d3.select(host).append('svg').attr('width', w).attr('height', h).attr('viewBox', `0 0 ${w} ${h}`).attr('role', 'img').attr('aria-label', '一日時間帶圖');
    const defs = svg.append('defs');
    defs.append('pattern').attr('id', 'hatch').attr('width', 6).attr('height', 6).attr('patternUnits', 'userSpaceOnUse').attr('patternTransform', 'rotate(45)')
      .append('rect').attr('width', 2).attr('height', 6).attr('fill', '#7d8a84');
    const hours = d3.range(7, 17);
    svg.append('g').selectAll('line').data(hours).join('line').attr('x1', d => x(d * 60)).attr('x2', d => x(d * 60)).attr('y1', 22).attr('y2', h - 18).attr('stroke', C.rule).attr('stroke-width', 1);
    svg.append('g').selectAll('text').data(hours).join('text').attr('x', d => x(d * 60)).attr('y', h - 4).attr('text-anchor', 'middle')
      .attr('font-family', 'IBM Plex Mono, monospace').attr('font-size', 11).attr('fill', C.ink2).text(d => String(d).padStart(2, '0') + ':00');
    const laneLabels = [['jr', 'JR 奈良線'], ['inari', '伏見稲荷'], ['uji', '宇治'], ['seal', '御朱印']];
    svg.append('g').selectAll('text').data(laneLabels).join('text').attr('x', 10).attr('y', d => (d[0] === 'seal' ? sealY : lanes[d[0]]) + 4)
      .attr('font-family', 'Shippori Mincho B1, serif').attr('font-weight', 800).attr('font-size', 14).attr('fill', C.ink).text(d => d[1]);
    const fill = o => o.kind === 'train' ? C.ai : (o.kind === 'walk' || o.kind === 'pause') ? 'url(#hatch)' : o.kind === 'eat' ? C.kin : (o.lane === 'uji' ? C.matcha : C.shu);
    const g = svg.append('g');
    const bars = g.selectAll('g').data(ITEMS).join('g').attr('class', 'bar').style('cursor', 'pointer');
    bars.append('rect').attr('x', o => x(o.a)).attr('y', o => lanes[o.lane] - bh / 2).attr('width', o => Math.max(2, x(o.b) - x(o.a))).attr('height', bh).attr('rx', 2)
      .attr('fill', fill).attr('stroke', o => (o.kind === 'walk' || o.kind === 'pause') ? '#7d8a84' : 'none').attr('stroke-dasharray', o => o.flex ? '3 2' : null)
      .attr('fill-opacity', o => o.flex ? 0.6 : 1);
    bars.filter(o => o.kind === 'train').append('line').attr('x1', o => x(o.a) + 2).attr('x2', o => x(o.b) - 2).attr('y1', o => lanes[o.lane] + 6).attr('y2', o => lanes[o.lane] + 6).attr('stroke', '#ECE6D3').attr('stroke-width', 2);
    const stag = { jr: 0, inari: 0, uji: 0 };
    bars.each(function (o) {
      const wpx = x(o.b) - x(o.a), short = o.short;
      const fits = wpx > short.length * 12.5 + 10;
      const sel = d3.select(this);
      const light = o.kind === 'walk' || o.kind === 'pause';
      if (fits) sel.append('text').attr('x', x(o.a) + 6).attr('y', lanes[o.lane] + 5).attr('font-size', 12).attr('font-weight', 700)
        .attr('fill', light ? C.ink : '#fff').attr('paint-order', light ? 'stroke' : null).attr('stroke', light ? C.sheet : null).attr('stroke-width', light ? 3 : null).text(short);
      else if (!(light && o.b - o.a < 12) && o.lane !== 'jr') {
        const row = stag[o.lane]++ % 2, ly = lanes[o.lane] + bh / 2 + 12 + row * 12, cx = (x(o.a) + x(o.b)) / 2;
        sel.append('line').attr('x1', cx).attr('x2', cx).attr('y1', lanes[o.lane] + bh / 2).attr('y2', ly - 9).attr('stroke', C.ink2).attr('stroke-width', 0.8);
        sel.append('text').attr('x', cx).attr('y', ly).attr('text-anchor', 'middle').attr('font-size', 10.5).attr('fill', C.ink).text(short);
      }
      sel.append('title').text(`${o.s}–${o.e} ${o.title}${o.jp ? '｜' + o.jp : ''}`);
    });
    // departures
    svg.append('g').selectAll('text').data(DEPART).join('text').attr('x', d => x(d)).attr('y', lanes.jr - bh / 2 - 5).attr('text-anchor', 'middle')
      .attr('font-family', 'IBM Plex Mono, monospace').attr('font-size', 10.5).attr('font-weight', 600).attr('fill', C.ai).text(d => fmt(d));
    // time boundaries
    const pg = svg.append('g').selectAll('g').data(PINS).join('g');
    pg.append('path').attr('d', d => `M${x(d.t)},${lanes.uji - bh / 2 - 2} l-4,-7 h8 z`).attr('fill', '#B4741A');
    pg.append('text').attr('x', d => x(d.t) + (d.t === hm('16:00') ? 6 : -6)).attr('y', (d, i) => lanes.uji - bh / 2 - 12 - (i === 2 ? 11 : 0))
      .attr('text-anchor', d => d.t === hm('16:00') ? 'end' : 'end').attr('font-size', 10.5).attr('fill', '#8A5410').text(d => fmt(d.t) + ' ' + d.txt);
    // seals with Rough.js
    const sg = svg.append('g');
    const rc2 = window.rough ? rough.svg(svg.node()) : null;
    SEALS.forEach((sl, i) => {
      const cx = x(sl.t), sz = 22;
      if (rc2) sg.node().appendChild(rc2.rectangle(cx - sz / 2, sealY - sz / 2 - 2, sz, sz, { stroke: C.shu, strokeWidth: 1.6, roughness: 1.1, seed: 11 + i, fill: 'rgba(199,53,28,.08)', fillStyle: 'solid', strokeLineDash: sl.flex ? [3, 3] : undefined }));
      else sg.append('rect').attr('x', cx - sz / 2).attr('y', sealY - sz / 2 - 2).attr('width', sz).attr('height', sz).attr('fill', 'none').attr('stroke', C.shu);
      sg.append('text').attr('x', cx).attr('y', sealY + 3).attr('text-anchor', 'middle').attr('font-family', 'Shippori Mincho B1, serif').attr('font-weight', 800).attr('font-size', 13).attr('fill', C.shu).text('印');
      sg.append('text').attr('x', cx).attr('y', sealY + 24 + (i % 2) * 12).attr('text-anchor', 'middle').attr('font-size', 10.5).attr('fill', C.ink2).text(sl.name + (sl.flex ? '（彈性）' : ''));
    });
    // playhead
    const ph = svg.append('g').attr('pointer-events', 'none');
    const pl = ph.append('line').attr('y1', 18).attr('y2', h - 18).attr('stroke', C.shu).attr('stroke-width', 2);
    const pb = ph.append('rect').attr('y', 2).attr('width', 46).attr('height', 17).attr('rx', 2).attr('fill', C.shu);
    const pt = ph.append('text').attr('y', 15).attr('text-anchor', 'middle').attr('font-family', 'IBM Plex Mono, monospace').attr('font-size', 11.5).attr('font-weight', 600).attr('fill', '#fff');
    gantt.update = t => { const px = x(t); pl.attr('x1', px).attr('x2', px); pb.attr('x', px - 23); pt.attr('x', px).text(fmt(t)); };
    gantt.update(state.t);
    const toT = ev => x.invert(d3.pointer(ev, svg.node())[0]);
    svg.on('pointerdown', ev => { stop(); setT(toT(ev)); svg.on('pointermove.drag', e => setT(toT(e))); })
      .on('pointerup pointerleave', () => svg.on('pointermove.drag', null));
  }

  /* ---------- boot ---------- */
  initGL();
  const boot = () => { resize(); drawGantt(); lastShown = -1; setT(state.t); requestAnimationFrame(frame); if (!reduce) setTimeout(() => { if (!playing && state.t <= 421) play(); }, 900); };
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { resize(); drawGantt(); }, 150); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
