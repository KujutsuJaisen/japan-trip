        <!--js code start-->
        <script src="./js/jquery-1.11.3.min.js"></script>
        <script src="./js/jquery.fancybox.min.js"></script>
        
        <!--360° view js-->
        <script src="./js/three.min.js"></script>
        <script src="./js/photo-sphere-viewer.min.js"></script>
        <script src="./js/viewer-init.js"></script>

        <!--button setup-->
        <script>
            
            /*block button click event*/
            $("#menu > a").click(function () {

                var id = this.id;
                // var context = this.title;
                var context = this.innerHTML;
                /*get floor id*/
                var str = id;
                var substr = str.substring(0, 3);

                checkView(id);
                checkRoute(id.slice(2,3), context);

                /*change the menu background image in left side 
                when block button clicked*/
                $("#menu").css("background-image","url(./img/" + id + ".png)");

                $("#menu > a").hide();
                $("." + substr).show();
                $("#" + id).hide();
            });

            /*floor button click event*/
            $("#floor > a").click(function () {

                /*get floor id*/
                var id = this.id;

                /*get default string*/
                var context = document.getElementById(id + "_01").innerHTML;

                checkView(id + "_01");
                checkRoute(id.slice(2,3), context);

                /*change the menu background default image in left side 
                when floor button clicked*/
                $("#menu").css("background-image","url(./img/" + id + "_01.png)");

                /*hide all block button before show*/
                $("#menu > a").hide();
                $("#menu > a."+ id +"").show();
                $("#" + id + "_01").hide();

                //checkRoute(id);
            });

            /*check route event*/
            function checkRoute(floor, blockName){
                /*get route DOM*/
                var route = document.getElementById('route-name');
                route.innerHTML = floor + "F\n" + blockName;
            }

            /*check view event*/
            function checkView(id){
                var div = document.getElementById('container');
                var PSV = new PhotoSphereViewer({
                    panorama: 'img/' + id + '.jpg',
                    container: div,
                    default_position: { long: Math.PI / 0.7, lat: Math.PI / 0.5 },
                    time_anim: false, //autoplay mode, default 2000ms(2s), bool
                    navbar: false,
                    navbar_style: {
                        backgroundColor: 'rgba(0, 0, 0, 0.8)'
                    },
                });
            }

            /*mobile only*/
            /*floor-m button click event*/
            $("#floor-m > a").click(function () {

                var id = this.id;

                /*change the menu background default image in left side 
                when floor button clicked*/
                $("#menu-m").css("background-image", "url(./img/" + id + "_01-m.jpg)");

                /*hide all block button before show*/
                $("#menu-m > a").hide();
                $("#menu-m > a." + id + "").show();

            });
        </script>
